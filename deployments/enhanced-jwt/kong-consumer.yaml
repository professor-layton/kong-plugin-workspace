apiVersion: v1
kind: Secret
metadata:
  name: jwt-key-1
  namespace: kong-app
  labels:
    konghq.com/credential: enhanced-jwt
data:
  algorithm: UlMyNTY=
  claims_to_verify: ZXhwLG5iZg==
  key: YTM2YzMwMzliMzYyNDlhM2M5Zjg4OTEwYjEyNzI0M2M=
  kongCredType: and0
  rsa_public_key: 
---
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: consumer-user0
  namespace: kong-app
  annotations:
    kubernetes.io/ingress.class: kong
