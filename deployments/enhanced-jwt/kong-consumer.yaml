    konghq.com/credential: enhanced-jwt
data:
  algorithm: UlMyNTY=
  claims_to_verify: ZXhwLG5iZg==
  key: YTNmYzMwNDliMzYyNDlhOGM5Zjg4OTFjYjEyNzI0M2M=
  kongCredType: and0
  rsa_public_key: 
